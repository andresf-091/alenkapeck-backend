syntax = "proto3";

package user.v1;

option go_package = "github.com/andresf-091/alenkapeck-backend/services/messenger";

message GetUserRequest {
    string id = 1;
}

message GetUserResponse {
    string id = 1;
    string email = 2;
    string username = 3;
    string role = 4;
}


service UserService {
    rpc GetUser(GetUserRequest) returns (GetUserResponse);
}